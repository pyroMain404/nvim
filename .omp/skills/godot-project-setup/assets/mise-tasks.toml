# Task del gioco, da unire al 'mise.toml' che `mise use godot@<x.y>` ha già
# scritto nella root. Stanno qui e non nella config di Neovim perché dipendono dal
# progetto: quale preset, quale suite, quale output. Si eseguono con
# `mise run test` e `mise run export:windows`, e `mise tasks` li elenca.

[tools]
# Scritto da `mise use godot@4.5.1-stable`: la versione è del progetto, non della
# macchina, e segue chi clona.
godot = "4.5.1-stable"

[tasks.test]
description = "Run the test suite headless"
# Sostituire con il runner che il gioco usa davvero (GUT, GdUnit4, uno script
# proprio). Non esiste un comando universale, ed è la ragione per cui `:make`
# della config non prova a coprirlo: controlla se UN file si parsa, niente di più.
run = "godot --headless --path . --script res://test/run_tests.gd"

[tasks."export:windows"]
description = "Export the Godot project for Windows"
# NOTE: il nome fra virgolette è il preset di 'export_presets.cfg', che va creato
# una volta dall'editor grafico: il motore non lo inventa.
#
# NOTE: `--export-release` richiede gli export template della versione ESATTA del
# motore, che `mise` non installa insieme a esso. Su Windows vanno sotto
# '%APPDATA%\Godot\export_templates\<versione>' - le guide che circolano usano il
# percorso Linux '~/.local/share/godot/export_templates', che qui non è nulla.
run = [
  "mkdir -p build/windows",
  "godot --headless --path . --export-release \"Windows Desktop\" build/windows/game.exe",
]
